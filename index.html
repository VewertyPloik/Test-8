<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#120b06" />
<title>Cozy Coffee</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#120b06; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none; -webkit-touch-callout:none;
  }
  #c { display:block; width:100%; height:100%; }

  #ui {
    position:fixed; inset:0; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    padding: calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 26px);
  }
  #ui::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 44%, rgba(0,0,0,0.60) 100%);
  }

  #top { display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:2; }
  .pillRow { display:flex; gap:8px; }

  .pill {
    display:flex; align-items:center; gap:7px;
    background: rgba(30,18,10,0.6);
    border: 1px solid rgba(255,190,120,0.22);
    border-radius: 999px;
    padding: 9px 16px;
    color: #ffd9a8;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: .4px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.45);
  }
  .pill svg { width:19px; height:19px; display:block; }

  #scorePill { pointer-events:auto; cursor:pointer; transition: transform .12s ease; }
  #scorePill:active { transform: scale(0.96); }

  #shopBtn, #helpBtn, #achBtn {
    pointer-events:auto; cursor:pointer; font-family:inherit;
    transition: transform .12s ease;
  }
  #shopBtn:active, #helpBtn:active, #achBtn:active { transform: scale(0.94); }

  #achBtn { padding: 9px 12px; }
  #achBtn svg { width:20px; height:20px; stroke:#ffd9a8; fill:none; }

  #bottom { display:flex; flex-direction:column; align-items:center; gap:12px; position:relative; z-index:2; }

  #hint {
    font-size: 23px; font-weight: 800; letter-spacing: .3px;
    color: #ffe6c4;
    text-shadow: 0 3px 16px rgba(0,0,0,0.9), 0 0 34px rgba(255,150,60,0.35);
    transition: color .16s ease, transform .16s ease;
    text-align:center; padding: 0 12px; min-height: 32px;
  }
  #hint.hot {
    color:#8dffb4; transform: scale(1.09);
    text-shadow: 0 3px 16px rgba(0,0,0,0.9), 0 0 30px rgba(80,255,140,0.75);
  }
  #hint.spill {
    color:#ff9b8a; transform: scale(1.09);
    text-shadow: 0 3px 16px rgba(0,0,0,0.9), 0 0 30px rgba(255,90,70,0.7);
  }
  #hint.serve { color:#ffcf8f; animation: pulseServe 1s ease-in-out infinite; }
  @keyframes pulseServe {
    0%,100% { transform: scale(1);    text-shadow: 0 3px 16px rgba(0,0,0,0.9), 0 0 26px rgba(255,170,80,0.5); }
    50%     { transform: scale(1.07); text-shadow: 0 3px 16px rgba(0,0,0,0.9), 0 0 44px rgba(255,190,100,0.95); }
  }

  #tapRing {
    width: 56px; height: 56px; border-radius: 50%;
    border: 3px solid rgba(255,200,140,0.35);
    display:flex; align-items:center; justify-content:center;
    animation: breathe 1.9s ease-in-out infinite;
    opacity: 0; transition: opacity .3s ease;
  }
  #tapRing svg { width:25px; height:25px; stroke:#ffd9a8; }
  #tapRing.on { opacity: 1; }
  @keyframes breathe {
    0%,100% { transform: scale(1);    border-color: rgba(255,200,140,0.28); }
    50%     { transform: scale(1.13); border-color: rgba(255,200,140,0.8); }
  }

  #coffeePicker {
    display:flex; gap:9px; pointer-events:auto;
    transition: opacity .2s ease;
  }
  #coffeePicker.locked { opacity: 0.4; }
  #coffeePicker.locked .coffeeBtn { pointer-events:none; }
  #coffeePicker.shake { animation: shakeX .35s ease; }

  .coffeeBtn {
    pointer-events:auto; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; gap:7px;
    padding: 8px 14px 8px 9px;
    border-radius: 999px;
    background: rgba(30,18,10,0.62);
    border: 1.5px solid rgba(255,190,120,0.20);
    color:#ffd9a8; font-size:13.5px; font-weight:800; letter-spacing:.2px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform .12s ease, border-color .18s, background .18s, box-shadow .18s;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
  }
  .coffeeBtn svg { width:26px; height:26px; display:block; flex:0 0 26px; }
  .coffeeBtn:active { transform: scale(0.94); }
  .coffeeBtn.selected {
    border-color:#7bffb0;
    background: rgba(90,255,150,0.14);
    box-shadow: 0 0 18px rgba(90,255,150,0.30);
  }

  #toast {
    position:absolute; left:50%; top:36%;
    transform: translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center; gap:2px;
    font-size: 13vmin; font-weight:800; line-height:1;
    opacity:0; pointer-events:none;
    filter: drop-shadow(0 8px 26px rgba(0,0,0,0.7));
    white-space:nowrap; z-index:3;
  }
  #toast.txt { font-size: 8.5vmin; }
  #toast svg { vertical-align: middle; filter: drop-shadow(0 6px 18px rgba(255,170,60,0.55)); }
  #toast.spill { color:#ff8b7a; text-shadow: 0 4px 22px rgba(255,70,50,0.5); }
  #toast.show { animation: toastPop 1.4s cubic-bezier(.2,.9,.3,1) forwards; }
  @keyframes toastPop {
    0%   { opacity:0; transform: translate(-50%,-50%) scale(0.15) rotate(-14deg); }
    20%  { opacity:1; transform: translate(-50%,-50%) scale(1.2) rotate(5deg); }
    44%  { opacity:1; transform: translate(-50%,-50%) scale(1) rotate(0deg); }
    76%  { opacity:1; transform: translate(-50%,-58%) scale(1); }
    100% { opacity:0; transform: translate(-50%,-98%) scale(0.8); }
  }

  #achToast {
    position: fixed;
    top: calc(env(safe-area-inset-top,0px) + 78px);
    left: 50%;
    transform: translate(-50%, -24px);
    display: flex; align-items: center; gap: 12px;
    padding: 11px 18px 11px 13px;
    border-radius: 16px;
    background: linear-gradient(135deg, #2e1e08 0%, #1a0f06 100%);
    border: 1.5px solid rgba(255,207,90,0.65);
    box-shadow:
      0 8px 34px rgba(255,190,80,0.35),
      0 0 70px rgba(255,170,50,0.18),
      inset 0 0 18px rgba(255,200,100,0.06);
    opacity: 0; pointer-events: none;
    z-index: 42;
    transition: opacity .32s ease, transform .42s cubic-bezier(.2,.9,.3,1);
    max-width: calc(100vw - 32px);
  }
  #achToast.show { opacity: 1; transform: translate(-50%, 0); }
  #achToastIcon {
    width: 42px; height: 42px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd97a, #c88a25);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 22px rgba(255,190,70,0.55), inset 0 -3px 8px rgba(120,70,10,0.5);
    flex: 0 0 42px;
  }
  #achToastIcon svg { width: 22px; height: 22px; stroke:#3a2208; fill:none; }
  #achToastText { display:flex; flex-direction:column; gap:2px; min-width:0; }
  #achToastLabel {
    font-size: 10.5px; font-weight: 900; letter-spacing: 1.6px;
    text-transform: uppercase; color: #ffcf5a;
  }
  #achToastName {
    font-size: 16px; font-weight: 900; color: #ffe6c4;
    letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  #loading {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#120b06; color:#ffd9a8; font-size:20px; font-weight:700; z-index:50;
    transition: opacity .55s ease;
  }
  #loading.hide { opacity:0; pointer-events:none; }

  /* ===================== SHOP ===================== */
  #shop {
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:flex-end; justify-content:center;
    pointer-events:none; opacity:0;
    transition: opacity .22s ease;
  }
  #shop.open { pointer-events:auto; opacity:1; }
  #shopBackdrop {
    position:absolute; inset:0;
    background: rgba(8,4,2,0.62);
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
  }
  #shopPanel {
    position:relative; width:100%; max-width:520px;
    max-height: 80vh; display:flex; flex-direction:column;
    background: linear-gradient(180deg, #261708 0%, #1a0f06 100%);
    border: 1px solid rgba(255,190,120,0.20);
    border-bottom: none;
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -12px 50px rgba(0,0,0,0.65);
    transform: translateY(102%);
    transition: transform .32s cubic-bezier(.2,.9,.3,1);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #shop.open #shopPanel { transform: translateY(0); }

  #shopHead {
    display:flex; align-items:center; gap:12px;
    padding: 18px 20px 12px;
    border-bottom: 1px solid rgba(255,190,120,0.10);
  }
  #shopTitle { font-size:22px; font-weight:800; color:#ffe6c4; letter-spacing:.5px; flex:1; }
  #shopCoins {
    display:flex; align-items:center; gap:6px;
    background: rgba(255,200,120,0.10);
    border: 1px solid rgba(255,200,120,0.22);
    border-radius: 999px; padding: 6px 13px;
    color:#ffcf5a; font-weight:800; font-size:16px;
  }
  #shopCoins svg { width:16px; height:16px; }
  #shopClose {
    pointer-events:auto; cursor:pointer;
    width:38px; height:38px; border-radius:50%;
    background: rgba(255,190,120,0.08);
    border: 1px solid rgba(255,190,120,0.18);
    display:flex; align-items:center; justify-content:center;
    transition: transform .12s ease, background .15s;
  }
  #shopClose:active { transform: scale(0.9); background: rgba(255,190,120,0.18); }
  #shopClose svg { width:17px; height:17px; stroke:#ffd9a8; }

  #shopBody {
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    touch-action: pan-y;
    padding: 6px 16px 24px;
  }
  .shopSection {
    font-size: 13px; font-weight:800; letter-spacing:1.6px;
    text-transform: uppercase; color:#c99b6a;
    padding: 18px 4px 10px;
  }
  .shopGrid {
    display:grid; grid-template-columns: repeat(3, 1fr); gap:10px;
  }
  .shopItem {
    pointer-events:auto; cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    background: rgba(255,220,170,0.055);
    border: 1.5px solid rgba(255,190,120,0.14);
    border-radius: 16px;
    padding: 11px 5px 9px;
    color:#ffdcb0; font-size:12.5px; font-weight:700;
    transition: transform .12s ease, border-color .18s, background .18s, box-shadow .18s;
  }
  .shopItem:active { transform: scale(0.96); }
  .shopItem svg { width:44px; height:44px; display:block; }
  .shopItem .itemName { text-align:center; line-height:1.15; }
  .shopItem .priceRow {
    display:flex; align-items:center; gap:3px;
    font-size:12px; color:#ffcf5a; font-weight:800;
  }
  .shopItem .priceRow svg { width:13px; height:13px; }
  .shopItem .ownedTag { font-size:11px; color:#8dffb4; font-weight:800; letter-spacing:.5px; }
  .shopItem.selected {
    border-color:#7bffb0;
    background: rgba(90,255,150,0.10);
    box-shadow: 0 0 18px rgba(90,255,150,0.22);
  }
  .shopItem.selected .ownedTag { color:#b6ffd0; }
  .shopItem.cant { opacity:0.42; }
  @keyframes shakeX {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-5px); }
    75%     { transform: translateX(5px); }
  }
  .shopItem.shake, .pill.shake { animation: shakeX .35s ease; }

  /* ===================== HELP ===================== */
  #help {
    position:fixed; inset:0; z-index:30;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; opacity:0; padding: 22px;
    transition: opacity .22s ease;
  }
  #help.open { pointer-events:auto; opacity:1; }
  #helpBackdrop {
    position:absolute; inset:0;
    background: rgba(8,4,2,0.72);
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
  }
  #helpPanel {
    position:relative; width:100%; max-width:440px; max-height: 84vh;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    touch-action: pan-y;
    background: linear-gradient(180deg, #261708 0%, #1a0f06 100%);
    border: 1px solid rgba(255,190,120,0.22);
    border-radius: 24px;
    padding: 22px 22px 20px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.72);
    transform: translateY(16px) scale(0.96);
    transition: transform .3s cubic-bezier(.2,.9,.3,1);
  }
  #help.open #helpPanel { transform: translateY(0) scale(1); }
  #helpTitle {
    font-size:21px; font-weight:800; color:#ffe6c4; letter-spacing:.4px;
    display:flex; align-items:center; gap:9px; margin-bottom:16px;
  }
  .helpStep {
    display:flex; gap:11px; align-items:flex-start;
    color:#ffdcb0; font-size:14px; line-height:1.45; font-weight:600;
    margin-bottom:13px;
  }
  .helpNum {
    flex:0 0 25px; width:25px; height:25px; border-radius:50%;
    background: rgba(255,190,120,0.14);
    border: 1px solid rgba(255,190,120,0.28);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#ffcf5a; font-size:12.5px;
  }
  .helpLegend {
    display:flex; flex-wrap:wrap; gap:8px; margin: 6px 0 18px;
  }
  .helpLegend span {
    display:flex; align-items:center; gap:6px;
    background: rgba(255,220,170,0.07);
    border: 1px solid rgba(255,190,120,0.18);
    border-radius: 999px; padding: 5px 12px 5px 6px;
    font-size:12.5px; font-weight:800; color:#ffdcb0;
  }
  .helpLegend svg { width:22px; height:22px; display:block; }
  #helpOk {
    pointer-events:auto; cursor:pointer; font-family:inherit;
    width:100%; margin-top:6px;
    padding: 13px; border-radius: 14px; border:none;
    background: linear-gradient(180deg, #f0b667, #d99344);
    color:#2a1505; font-size:16px; font-weight:900; letter-spacing:.6px;
    box-shadow: 0 8px 24px rgba(220,140,60,0.35);
    transition: transform .12s ease;
  }
  #helpOk:active { transform: scale(0.97); }

  /* ===================== ACHIEVEMENTS PANEL ===================== */
  #ach {
    position:fixed; inset:0; z-index:30;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; opacity:0; padding: 22px;
    transition: opacity .22s ease;
  }
  #ach.open { pointer-events:auto; opacity:1; }
  #achBackdrop {
    position:absolute; inset:0;
    background: rgba(8,4,2,0.72);
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
  }
  #achPanel {
    position:relative; width:100%; max-width:440px; max-height: 84vh;
    display:flex; flex-direction:column;
    background: linear-gradient(180deg, #261708 0%, #1a0f06 100%);
    border: 1px solid rgba(255,190,120,0.22);
    border-radius: 24px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.72);
    transform: translateY(16px) scale(0.96);
    transition: transform .3s cubic-bezier(.2,.9,.3,1);
    overflow: hidden;
  }
  #ach.open #achPanel { transform: translateY(0) scale(1); }
  #achHead {
    display:flex; align-items:center; gap:10px;
    padding: 18px 20px 14px;
    border-bottom: 1px solid rgba(255,190,120,0.10);
  }
  #achHeadIcon {
    width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd97a, #c88a25);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 16px rgba(255,190,70,0.45);
    flex: 0 0 34px;
  }
  #achHeadIcon svg { width:18px; height:18px; stroke:#3a2208; fill:none; }
  #achHeadText { flex:1; display:flex; flex-direction:column; gap:2px; }
  #achTitle { font-size:19px; font-weight:900; color:#ffe6c4; letter-spacing:.4px; }
  #achSub { font-size:12.5px; font-weight:700; color:#c99b6a; letter-spacing:.3px; }
  #achClose {
    pointer-events:auto; cursor:pointer;
    width:36px; height:36px; border-radius:50%;
    background: rgba(255,190,120,0.08);
    border: 1px solid rgba(255,190,120,0.18);
    display:flex; align-items:center; justify-content:center;
    transition: transform .12s ease, background .15s;
    flex: 0 0 36px;
  }
  #achClose:active { transform: scale(0.9); background: rgba(255,190,120,0.18); }
  #achClose svg { width:16px; height:16px; stroke:#ffd9a8; }
  #achBody {
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    touch-action: pan-y;
    padding: 12px 16px 18px;
    display:flex; flex-direction:column; gap:10px;
  }
  .achRow {
    display:flex; align-items:center; gap:12px;
    padding: 12px 14px;
    border-radius: 16px;
    background: rgba(255,220,170,0.045);
    border: 1.5px solid rgba(255,190,120,0.12);
    transition: border-color .2s, background .2s;
  }
  .achRow.unlocked {
    background: linear-gradient(135deg, rgba(255,205,90,0.13), rgba(255,150,40,0.05));
    border-color: rgba(255,207,90,0.55);
    box-shadow: inset 0 0 18px rgba(255,190,80,0.08);
  }
  .achRowIcon {
    width: 40px; height: 40px; border-radius: 50%;
    flex: 0 0 40px;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,200,120,0.08);
    border: 1px solid rgba(255,190,120,0.16);
  }
  .achRowIcon svg { width:20px; height:20px; stroke:#8a6a44; fill:none; }
  .achRow.unlocked .achRowIcon {
    background: radial-gradient(circle at 35% 30%, #ffd97a, #c88a25);
    border-color: transparent;
    box-shadow: 0 0 16px rgba(255,190,70,0.45);
  }
  .achRow.unlocked .achRowIcon svg { stroke:#3a2208; }
  .achRowBody { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .achRowName {
    font-size:14.5px; font-weight:900; color:#c9a482;
    letter-spacing:.3px;
  }
  .achRow.unlocked .achRowName { color:#ffe6c4; }
  .achRowDesc {
    font-size:11.5px; font-weight:700; color:#8a6a48;
    letter-spacing:.2px;
  }
  .achRow.unlocked .achRowDesc { color:#d1a870; }
  .achRowBar {
    height: 5px; border-radius: 999px;
    background: rgba(255,200,120,0.10);
    overflow: hidden; margin-top: 4px;
  }
  .achRowBarFill {
    height:100%; border-radius: 999px;
    background: linear-gradient(90deg, #ffb74d, #ffcf5a);
    transition: width .4s ease;
  }
  .achRow.unlocked .achRowBarFill {
    background: linear-gradient(90deg, #ffd97a, #ffe9a8);
    box-shadow: 0 0 12px rgba(255,220,120,0.65);
  }
  .achRowMeta {
    flex: 0 0 auto;
    text-align: right;
    font-size: 12px; font-weight: 900;
    color:#8a6a48; letter-spacing:.3px;
    display:flex; flex-direction:column; align-items:flex-end; gap:4px;
  }
  .achRow.unlocked .achRowMeta { color:#ffcf5a; }
  .achRowCheck {
    width: 22px; height: 22px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,200,120,0.10);
    border: 1px solid rgba(255,190,120,0.20);
  }
  .achRowCheck svg { width:12px; height:12px; stroke:#8a6a48; fill:none; }
  .achRow.unlocked .achRowCheck {
    background: #ffcf5a; border-color: #ffcf5a;
    box-shadow: 0 0 12px rgba(255,200,90,0.6);
  }
  .achRow.unlocked .achRowCheck svg { stroke:#3a2208; }

  /* ===================== SECRET CODE PANEL ===================== */
  #code {
    position:fixed; inset:0; z-index:35;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; opacity:0; padding: 22px;
    transition: opacity .22s ease;
  }
  #code.open { pointer-events:auto; opacity:1; }
  #codeBackdrop {
    position:absolute; inset:0;
    background: rgba(8,4,2,0.80);
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
  }
  #codePanel {
    position:relative; width:100%; max-width:380px;
    background: linear-gradient(180deg, #261708 0%, #1a0f06 100%);
    border: 1px solid rgba(255,190,120,0.25);
    border-radius: 24px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.78);
    transform: translateY(16px) scale(0.96);
    transition: transform .3s cubic-bezier(.2,.9,.3,1);
    overflow: hidden;
  }
  #code.open #codePanel { transform: translateY(0) scale(1); }
  #codeHead {
    display:flex; align-items:center; gap:10px;
    padding: 18px 20px 14px;
    border-bottom: 1px solid rgba(255,190,120,0.10);
  }
  #codeHeadIcon {
    width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd97a, #c88a25);
    display:flex; align-items:center; justify-content:center;

function svgToTexture(svg, size = 256){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  const img = new Image();
  img.onload = () => {
    g.clearRect(0, 0, size, size);
    g.drawImage(img, 0, 0, size, size);
    t.needsUpdate = true;
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  return t;
}

function tex(canvas){
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeWoodTexture(){
  const s = 512;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0,0,0,s);
  grad.addColorStop(0, '#9a663a');
  grad.addColorStop(0.5,'#8a5a33');
  grad.addColorStop(1, '#6f4526');
  g.fillStyle = grad; g.fillRect(0,0,s,s);
  for (let i=0;i<260;i++){
    const y = Math.random()*s;
    g.strokeStyle = `rgba(${52+Math.random()*46|0},${30+Math.random()*28|0},${12+Math.random()*18|0},${0.05+Math.random()*0.13})`;
    g.lineWidth = 0.4 + Math.random()*2.8;
    g.beginPath(); g.moveTo(-20, y);
    for (let x=0;x<=s+20;x+=24){
      g.lineTo(x, y + Math.sin(x*0.014 + i*1.7)*5 + (Math.random()-0.5)*2.4);
    }
    g.stroke();
  }
  for (let k=0;k<5;k++){
    const cx = Math.random()*s, cy = Math.random()*s;
    for (let r=2;r<26;r+=2.5){
      g.strokeStyle = `rgba(48,26,10,${0.10 - r*0.0026})`;
      g.lineWidth = 1.6;
      g.beginPath();
      g.ellipse(cx, cy, r*1.9, r*0.85, Math.random()*0.4, 0, Math.PI*2);
      g.stroke();
    }
  }
  const t = tex(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2.6, 1.2);
  return t;
}

function makeSoftDot(){
  const s = 128;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,   'rgba(255,255,255,0.95)');
  gr.addColorStop(0.35,'rgba(255,255,255,0.42)');
  gr.addColorStop(1,   'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,s,s);
  return tex(c);
}

function makeHeartTexture(){
  const s = 128;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#ff6f8f';
  g.shadowColor = 'rgba(255,60,110,0.9)';
  g.shadowBlur = 14;
  const cx = s/2, cy = s*0.40, r = s*0.29;
  g.beginPath();
  g.moveTo(cx, cy + r*1.55);
  g.bezierCurveTo(cx - r*2.1, cy + r*0.15, cx - r*0.95, cy - r*1.35, cx, cy - r*0.35);
  g.bezierCurveTo(cx + r*0.95, cy - r*1.35, cx + r*2.1, cy + r*0.15, cx, cy + r*1.55);
  g.fill();
  return tex(c);
}

function makeShadowTexture(){
  const s = 128;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');

}

function makeCremaTexture(){
  const s = 256;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0,0,s,s);
  for (let i=0;i<70;i++){
    const x = Math.random()*s, y = Math.random()*s, r = 6 + Math.random()*30;
    g.beginPath(); g.arc(x,y,r,0,Math.PI*2);
    g.fillStyle = `rgba(230,210,180,${0.06+Math.random()*0.16})`;

  }
  for (let i=0;i<50;i++){

    g.fill();
  }
  const gr = g.createRadialGradient(s/2,s/2,s*0.18,s/2,s/2,s*0.5);
  gr.addColorStop(0,'rgba(255,255,255,0)');
  gr.addColorStop(1,'rgba(220,200,170,1)');
  g.fillStyle = gr; g.fillRect(0,0,s,s);

function makeEnvTexture(){
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0,0,0,128);
  gr.addColorStop(0,   '#fff3e0');
  gr.addColorStop(0.42,'#c08a52');
  gr.addColorStop(0.55,'#6a4322');
  gr.addColorStop(1,   '#140d06');
  g.fillStyle = gr; g.fillRect(0,0,256,128);
  const rg = g.createRadialGradient(58,44,4,58,44,74);
  rg.addColorStop(0,'#fff6e2');
  rg.addColorStop(1,'rgba(255,220,160,0)');
  g.fillStyle = rg; g.fillRect(0,0,256,128);
  const rg2 = g.createRadialGradient(206,52,4,206,52,60);
  rg2.addColorStop(0,'#ffb870');
  rg2.addColorStop(1,'rgba(255,150,60,0)');
  g.fillStyle = rg2; g.fillRect(0,0,256,128);
  const t = tex(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  return t;
}

function makeMarbleTexture(baseColor, veinDark, veinLight){
  const s = 512;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');

  g.fillStyle = baseColor;
  g.fillRect(0,0,s,s);

  for (let i = 0; i < 60; i++){
    const x = Math.random()*s, y = Math.random()*s, r = 30 + Math.random()*90;
    const grd = g.createRadialGradient(x,y,0,x,y,r);
    const isLight = Math.random() < 0.5;
    grd.addColorStop(0, isLight ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.09)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd;
    g.fillRect(0,0,s,s);
  }

  function drawVein(startX, startY, len, color, width, alpha){
    g.strokeStyle = color;
    g.lineWidth = width;
    g.globalAlpha = alpha;
    g.lineCap = 'round';
    g.beginPath();
    let x = startX, y = startY;
    g.moveTo(x, y);
    const segs = 15 + (Math.random()*15 | 0);
    for (let i = 0; i < segs; i++){
      const nx = x + (Math.random()-0.5)*70;
      const ny = y + len/segs;
      const cx = (x+nx)/2 + (Math.random()-0.5)*50;
      const cy = (y+ny)/2;
      g.quadraticCurveTo(cx, cy, nx, ny);
      x = nx; y = ny;
    }
    g.stroke();
  }

  for (let i = 0; i < 12; i++){
    drawVein(Math.random()*s, -40, s+80, veinDark, 0.4 + Math.random()*1.4, 0.30 + Math.random()*0.35);
  }
  for (let i = 0; i < 9; i++){
    drawVein(Math.random()*s, -40, s+80, veinLight, 0.5 + Math.random()*1.6, 0.20 + Math.random()*0.35);
  }
  g.globalAlpha = 1;

  const t = tex(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1.5, 1.5);
  return t;
}

function spawnParticle(o){
  const m = new THREE.SpriteMaterial({
    map: o.map,
    transparent: true,
    depthWrite: false,
    color: o.color !== undefined ? o.color : 0xffffff,

    grav: o.grav || 0,

    map: dotTex,
    pos: pos.clone().add(new THREE.Vector3(rand(-0.05,0.05), 0.02, rand(-0.05,0.05))),
    vel: new THREE.Vector3(rand(-0.045,0.045), rand(0.20,0.36), rand(-0.045,0.045)),
    size: rand(0.09, 0.17),
    dur: rand(1.3, 2.1),
    color: 0xfff2e0
  });
}

function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    const u = p.userData;
    u.life += dt;
    const t = u.life / u.dur;
    if (t >= 1){
      scene.remove(p);
      p.material.dispose();
      particles.splice(i, 1);
      continue;
    }
    p.position.addScaledVector(u.vel, dt);
    u.vel.y += u.grav * dt;
    u.vel.multiplyScalar(1 - 1.3 * dt);

    let sc;
    if (u.isHeart){
      sc = u.size * (t < 0.26 ? easeOutBack(t / 0.26) : 1);
    } else {
      sc = u.size * Math.sin(Math.PI * Math.min(1, t * 1.05)) * 0.85 + u.size * 0.15;
    }
    p.scale.setScalar(Math.max(0.001, sc));

    let op = 1;
    if (t > 0.60) op = 1 - (t - 0.60) / 0.40;
    p.material.opacity = Math.max(0, op);
    p.material.rotation += u.spin * dt;
  }
}

function checkAchievements(silent){
  let any = false;
  for (const a of ACHIEVEMENTS){
    if (!unlockedAchievements.has(a.id) && G.served >= a.cups){
      unlockedAchievements.add(a.id);
      G.score += a.stars;
      totalStars += a.stars;
      any = true;
      if (!silent) showAchievementToast(a);
    }
  }
  if (any) updateHUD();
  saveGame();
}

function awardStars(n){
  if (n <= 0) return;
  G.score += n;
  totalStars += n;
  updateHUD();
  saveGame();
}

const SAVE_KEY = 'cozyCoffee_v5';

function saveGame(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      score: G.score,
      served: G.served,
      mugs: [...ownedMugs],
      pitchers: [...ownedPitchers],
      mug: selectedMug,
      pitcher: selectedPitcher,
      coffee: coffeeTypes[selectedCoffee].id,
      seenHelp: seenHelp,
      totalStars: totalStars,
      achievements: [...unlockedAchievements],
      steamEnabled: steamEnabled
    }));
  } catch(e){}
}

function loadGame(){
  try {
    const raw = localStorage.getItem(SAVE_KEY)
             || localStorage.getItem('cozyCoffee_v4')
             || localStorage.getItem('cozyCoffee_v3')
             || localStorage.getItem('cozyCoffee_v2');
    if (!raw) return;
    const d = JSON.parse(raw);
    G.score  = Math.max(0, d.score | 0);
    G.served = Math.max(0, d.served | 0);

    const safeMugs = (Array.isArray(d.mugs) ? d.mugs : [0]).filter(i => i >= 0 && i < mugStyles.length);
    ownedMugs = new Set(safeMugs);
    ownedMugs.add(0);

    const safePitchers = (Array.isArray(d.pitchers) ? d.pitchers : [0]).filter(i => i >= 0 && i < pitcherStyles.length);
    ownedPitchers = new Set(safePitchers);
    ownedPitchers.add(0);

    selectedMug = ownedMugs.has(d.mug) ? d.mug : 0;
    selectedPitcher = ownedPitchers.has(d.pitcher) ? d.pitcher : 0;

    const ci = coffeeTypes.findIndex(c => c.id === d.coffee);
    selectedCoffee = ci >= 0 ? ci : 0;
    seenHelp = !!d.seenHelp;
    steamEnabled = d.steamEnabled !== false;

    totalStars = Math.max(0, (d.totalStars | 0) || G.score);

    const validIds = new Set(ACHIEVEMENTS.map(a => a.id));
    unlockedAchievements = new Set(
      (Array.isArray(d.achievements) ? d.achievements : []).filter(id => validIds.has(id))
    );
    checkAchievements(true);
  } catch(e){}
}

function makeShopCard(kind, idx){
  const list = kind === 'mug' ? mugStyles : pitcherStyles;
  const s = list[idx];
  const owned = kind === 'mug' ? ownedMugs.has(idx) : ownedPitchers.has(idx);
  const selected = kind === 'mug' ? selectedMug === idx : selectedPitcher === idx;

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'shopItem'
    + (selected ? ' selected' : '')
    + (!owned && G.score < s.price ? ' cant' : '');

  const iconColor = kind === 'mug' ? (s.displayColor || s.color) : s.color;
  const icon = kind === 'mug' ? mugIcon(iconColor) : pitcherIcon(iconColor);
  const swatchStyle = (kind === 'mug' && s.glow)
    ? `style="filter: drop-shadow(0 0 7px ${s.glow})"`
    : '';
  btn.innerHTML = `
    <div class="swatch" ${swatchStyle}>${icon}</div>
    <div class="itemName">${s.name}</div>
    ${owned
      ? `<div class="ownedTag">${selected ? 'Selected' : 'Owned'}</div>`
      : `<div class="priceRow">${starSVG(13)}<span>${s.price}</span></div>`}
  `;

  btn.addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (owned){
      if (kind === 'mug'){ selectedMug = idx; applyMugStyle(idx); }
      else { selectedPitcher = idx; applyPitcherStyle(idx); }
      saveGame();
      renderShop();
    } else if (G.score >= s.price){
      G.score -= s.price;
      if (kind === 'mug'){ ownedMugs.add(idx); selectedMug = idx; applyMugStyle(idx); }
      else { ownedPitchers.add(idx); selectedPitcher = idx; applyPitcherStyle(idx); }
      updateHUD();
      saveGame();
      renderShop();
      if (navigator.vibrate) navigator.vibrate(12);
    } else {
      btn.classList.add('shake');
      setTimeout(() => btn.classList.remove('shake'), 380);
    }
  });

  return btn;
}

   POUR RESULT
========================================================= */
const MIN_FILL = 0.18;

function finishPour(){
  const f = G.fill;
  const want = customer ? customer.userData.want : coffeeTypes[selectedCoffee].id;
  const match = coffeeTypes[selectedCoffee].id === want;

  let stars, html, cls;

  if (f < MIN_FILL){
    stars = 0;
    html = 'Too little!';
    cls = 'spill';
  } else if (f > 1.0){
    stars = 0;
    html = 'Spilled!';
    cls = 'spill';
  } else if (!match){
    stars = 0;
    html = 'Wrong brew!';
    cls = 'spill';
  } else if (f >= ZONE_MIN && f <= ZONE_MAX){
    stars = 3;
    html = starSVG(62) + starSVG(62) + starSVG(62);
    cls = '';
  } else if (f >= ZONE_MIN - 0.15 && f <= ZONE_MAX + 0.10){
    stars = 2;
    html = starSVG(62) + starSVG(62);
    cls = '';
  } else {
    stars = 1;
    html = starSVG(62);
    cls = '';
  }

  // Add pour stars
  G.score += stars;
  totalStars += stars;
  G.served += 1;
  updateHUD();

  // Check achievement progress (cups-based)
  checkAchievements(false);

  G.phase = 'servePrompt';
  G.promptT = 0;
  G.serveT = 0;
  G.heartsDone = false;
  G.resetDone = false;

  setTimeout(() => showToast(html, cls), 240);
}

/* =========================================================
   UPDATE
========================================================= */
const POUR_X = 0.40, POUR_Y = 0.50, POUR_Z = 0.06, POUR_TILT = 0.92;
const REST_X = 0.52, REST_Y = 0.09, REST_Z = 0.02, REST_TILT = 0.05;

const _a = new THREE.Vector3();
const _b = new THREE.Vector3();

function update(dt){
  G.time += dt;

  /* ---------- camera (mimi preview) ---------- */
  const camTarget = mimiOpen ? 1 : 0;
  mimiCamT += (camTarget - mimiCamT) * Math.min(1, dt * 6);
  if (mimiCamT < 0.001 && !mimiOpen){
    camera.position.copy(NORMAL_CAM_POS);
    camera.lookAt(CAM_TARGET);
  } else {
    camera.position.lerpVectors(NORMAL_CAM_POS, MIMI_CAM_POS, mimiCamT);
    const look = CAM_TARGET.clone().lerp(MIMI_CAM_TARGET, mimiCamT);
    camera.lookAt(look);
  }

  /* ---------- pitcher pose ---------- */
  const isPouring = (G.phase === 'pouring');
  const tx = isPouring ? POUR_X : REST_X;
  const ty = isPouring ? POUR_Y : REST_Y;
  const tz = isPouring ? POUR_Z : REST_Z;
  const tt = isPouring ? POUR_TILT : REST_TILT;

  const spd = 1 - Math.exp(-dt * 7);
  pitcher.position.x += (tx - pitcher.position.x) * spd;
  pitcher.position.y += (ty - pitcher.position.y) * spd;
  pitcher.position.z += (tz - pitcher.position.z) * spd;
  pitcher.rotation.z += (tt - pitcher.rotation.z) * spd;

  if (isPouring) pitcher.position.y += Math.sin(G.time * 7) * 0.003;

  /* ---------- floating coffee-type badge ---------- */
  const wantId = customer ? customer.userData.want : coffeeTypes[selectedCoffee].id;
  const matches = coffeeTypes[selectedCoffee].id === wantId;
  const badgeTarget = matches ? 0.33 : 0.29;
  pitcherLogo.scale.x += (badgeTarget - pitcherLogo.scale.x) * Math.min(1, dt * 8);
  pitcherLogo.scale.y = pitcherLogo.scale.x;
  pitcherLogo.position.set(
    pitcher.position.x,
    pitcher.position.y + 0.46 + Math.sin(G.time * 2.4) * 0.014,
    pitcher.position.z
  );

  /* ---------- fill ---------- */
  if (G.phase === 'pouring' && pitcher.rotation.z > 0.58){
    G.fill = Math.min(OVERFILL_CAP, G.fill + POUR_RATE * dt);
  }

  const visualFill = Math.min(1.0, G.fill);
  const h = Math.max(0.0006, visualFill * FILL_MAX_H);
  coffee.scale.y = h;
  coffee.position.y = LIQ_BASE_Y + h / 2;
  coffee.visible = G.fill > 0.006;

  crema.visible = coffee.visible;
  crema.position.y = LIQ_BASE_Y + h + 0.0016;
  crema.rotation.z = Math.sin(G.time * 0.6) * 0.05;

  const surfaceY = LIQ_BASE_Y + h;

  /* ---------- overflow spill ---------- */
  const overflow = Math.max(0, G.fill - 1.0);
  G.over = overflow > 0.001;

  if (G.over){
    const o = clamp(overflow / 0.30, 0, 1);
    puddle.visible = true;
    puddleMat.opacity = 0.22 + o * 0.55;
    puddle.scale.setScalar(0.55 + o * 0.55);

    spillTimer -= dt;
    if (spillTimer <= 0){
      spillTimer = 0.055;
      spawnSpillDrip();
      spawnSpillDrip();
    }
  } else if (puddle.visible){
    puddleMat.opacity *= (1 - dt * 4);
    if (puddleMat.opacity < 0.02){
      puddleMat.opacity = 0;
      puddle.visible = false;
    }
  }

  /* ---------- zone glow ---------- */
  G.inZone = (G.fill >= ZONE_MIN && G.fill <= ZONE_MAX) && G.phase === 'pouring';
  const pulse = 0.5 + 0.5 * Math.sin(G.time * 5.5);
  const tOp = G.inZone ? 0.72 + 0.22 * pulse : (G.phase === 'pouring' ? 0.55 : 0.42);
  zoneMat.opacity += (tOp - zoneMat.opacity) * Math.min(1, dt * 12);
  zoneMat.emissiveIntensity = G.inZone ? 2.1 + pulse * 1.6 : 1.0;
  ringMat.emissiveIntensity = G.inZone ? 3.0 + pulse * 2.0 : 1.3;
  coffeeMat.emissiveIntensity = G.inZone ? 1.2 + pulse * 0.55 : 0.6;

  /* ---------- stream ---------- */
  const shouldPour = (G.phase === 'pouring') && pitcher.rotation.z > 0.58 && G.fill < 1.0;

  if (shouldPour){
    pitcher.updateMatrixWorld(true);
    spoutAnchor.getWorldPosition(_a);

    _b.set(0.0, surfaceY + 0.002, 0.06);
    if (_b.y > _a.y - 0.03) _b.y = _a.y - 0.03;

    updateStream(_a, _b);

    rippleTimer -= dt;
    if (rippleTimer <= 0){
      rippleTimer = 0.075;
      emitRipple(surfaceY);
      spawnSplash(new THREE.Vector3(_b.x + rand(-0.02, 0.02), surfaceY + 0.006, _b.z + rand(-0.02, 0.02)));
    }
  } else {
    stream.visible = false;
  }

  updateRipples(dt);

  /* ---------- steam (respects toggle) ---------- */
  if (steamEnabled && G.fill > 0.05 && Math.random() < dt * (shouldPour ? 16 : 8)){
    const wp = new THREE.Vector3();
    crema.getWorldPosition(wp);
    wp.y += 0.025;
    spawnSteam(wp);
  }

  /* ---------- mug pop ---------- */
  if (G.mugPop < 1){
    G.mugPop = Math.min(1, G.mugPop + dt / 0.32);
    if (G.phase !== 'serving'){
      mugGroup.scale.setScalar(Math.max(0.001, easeOutBack(G.mugPop)));
    }
  }

  /* ---------- customer ---------- */
  if (customer){
    const u = customer.userData;
    if (u.spawnT < 1){
      u.spawnT = Math.min(1, u.spawnT + dt / 0.42);
      customer.scale.setScalar(Math.max(0.001, easeOutBack(u.spawnT)));
    }
    if (G.phase !== 'serving'){
      customer.position.y = Math.sin(G.time * 1.55) * 0.010;
      customer.rotation.y = Math.sin(G.time * 0.62) * 0.055;
      customer.rotation.z *= 0.9;
      u.mouth.scale.set(1, 1, 1);
    }
    if (u.bubble){
      u.bubble.position.y = u.bubble.userData.baseY + Math.sin(G.time * 2.1 + 1.2) * 0.022;
    }
  }

  /* ---------- serve prompt ---------- */
  if (G.phase === 'servePrompt'){
    G.promptT += dt;
    const gp = 0.5 + 0.5 * Math.sin(G.time * 6);
    coffeeMat.emissiveIntensity = 1.3 + gp * 0.7;
    if (G.promptT > 0.85){
      G.phase = 'serving';
      G.serveT = 0;
    }
  }

  /* ---------- serving animation ---------- */
  if (G.phase === 'serving'){
    G.serveT += dt;
    const t = G.serveT;

    const flyDur = 0.80;
    const p = clamp(t / flyDur, 0, 1);
    const e = easeInOutCubic(p);

    const start = new THREE.Vector3(0, 0, 0.06);
    const ctrl  = new THREE.Vector3(0.04, 1.15, 0.40);
    const end   = new THREE.Vector3(0, 0.60, -1.02);

    const inv = 1 - e;
    const x = inv*inv*start.x + 2*inv*e*ctrl.x + e*e*end.x;
    const y = inv*inv*start.y + 2*inv*e*ctrl.y + e*e*end.y;
    const z = inv*inv*start.z + 2*inv*e*ctrl.z + e*e*end.z;

    if (p < 1){
      mugGroup.position.set(x, y, z);
      mugGroup.scale.setScalar(1 - e * 0.24);
      mugGroup.rotation.y = e * 1.7;
      mugGroup.rotation.z = Math.sin(p * Math.PI) * 0.26;
    }

    if (!G.heartsDone && t > 0.70){
      G.heartsDone = true;
      spawnHearts(new THREE.Vector3(0, 0.95, -1.38), 9);
      for (let i = 0; i < 10; i++){
        spawnSparkle(new THREE.Vector3(rand(-0.45,0.45), rand(0.35,0.95), rand(-1.45,-0.95)), 0xffd08a);
      }
      if (customer) customer.userData.mouth.scale.set(1.5, 1.75, 1.5);
    }

    if (customer && t > 0.70){
      const bt = clamp((t - 0.70) / 0.95, 0, 1);
      const bounce = Math.sin(bt * Math.PI * 2.4) * Math.exp(-bt * 2.8);
      customer.position.y = Math.abs(bounce) * 0.13;
      customer.rotation.z = bounce * 0.07;
      customer.rotation.y = Math.sin(bt * 9) * 0.05;
    }

    if (p >= 1){
      const fadeT = clamp((t - 0.86) / 0.38, 0, 1);
      mugGroup.position.set(end.x, end.y + fadeT * 0.06, end.z);
      mugGroup.scale.setScalar(Math.max(0.001, (1 - e * 0.24) * (1 - fadeT)));
      mugGroup.rotation.y = 1.7 + fadeT * 1.2;
    }

    if (!G.resetDone && t > 1.24){
      G.resetDone = true;
      mugGroup.position.set(0, 0, 0.06);
      mugGroup.rotation.set(0, 0, 0);
      mugGroup.scale.setScalar(0.001);
      G.fill = 0;
      G.mugPop = 0;
      G.over = false;
      puddle.visible = false;
      puddleMat.opacity = 0;
      spawnCustomer();
    }

    if (t > 1.90){
      G.phase = 'ready';
      mugGroup.scale.setScalar(1);
      mugGroup.position.set(0, 0, 0.06);
    }
  }

  /* ---------- mug idle ---------- */
  if (G.phase === 'ready' || G.phase === 'pouring'){
    if (G.mugPop >= 1) mugGroup.scale.setScalar(1);
    if (G.phase === 'pouring'){
      mugGroup.rotation.z = Math.sin(G.time * 24) * 0.004 * pitcher.rotation.z;
    } else {
      mugGroup.rotation.z *= 0.92;
    }
  }

  /* ---------- contact shadows ---------- */
  mugShadow.position.set(mugGroup.position.x, 0.0035, mugGroup.position.z);
  const sc = clamp(mugGroup.scale.x, 0, 1);
  mugShadow.scale.setScalar(0.62 + sc * 0.38);
  mugShadow.material.opacity = 0.18 + sc * 0.66;

  potShadow.position.set(pitcher.position.x, 0.0035, pitcher.position.z);
  const lift = clamp(1.0 - (pitcher.position.y - REST_Y) * 1.4, 0.15, 1.0);
  potShadow.scale.setScalar(0.55 + lift * 0.45);
  potShadow.material.opacity = 0.10 + lift * 0.55;

  /* ---------- HUD ---------- */
  if (G.phase === 'ready'){
    setHint('Hold to pour ' + coffeeTypes[selectedCoffee].name, '');
    tapRing.classList.add('on');
  } else if (G.phase === 'pouring'){
    tapRing.classList.remove('on');
    if (G.over) setHint('Too much!', 'spill');
    else if (G.inZone) setHint('Perfect! Let go', 'hot');
    else if (G.fill > ZONE_MAX) setHint('Let go!', 'hot');
    else setHint('Pouring ' + coffeeTypes[selectedCoffee].name + '…', '');
  } else {
    tapRing.classList.remove('on');
    setHint('Serve to customer', 'serve');
  }

  updatePickerLock();

  /* ---------- bokeh ---------- */
  for (const b of bokeh){
    b.position.y = b.userData.baseY + Math.sin(G.time * b.userData.spd + b.userData.ph) * 0.18;
  }

  /* ---------- particles ---------- */
  updateParticles(dt);

  /* ---------- lights ---------- */
  warmFill.intensity = 2.7 + Math.sin(G.time * 2.7) * 0.20 + Math.sin(G.time * 6.9) * 0.10;
}

/* =========================================================
   RESIZE
========================================================= */
function onResize(){
  const w = window.innerWidth;
  const h = window.innerHeight;

  renderer.setSize(w, h, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const aspect = w / h;
  camera.aspect = aspect;

  const dist = NORMAL_CAM_POS.distanceTo(CAM_TARGET);
  const targetWidth = 1.62;
  const hHalf = Math.atan((targetWidth / 2) / dist);
  const vHalf = Math.atan(Math.tan(hHalf) / aspect);

  camera.fov = clamp(2 * vHalf * 180 / Math.PI, 26, 84);
  camera.updateProjectionMatrix();
}

window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 130));
window.addEventListener('pagehide', saveGame);

/* =========================================================
   BOOT
========================================================= */
loadGame();
applyMugStyle(selectedMug);
applyPitcherStyle(selectedPitcher);
applyCoffeeStyle();
renderPicker();
buildHelp();

onResize();
spawnCustomer();
customer.scale.setScalar(1);
mugGroup.scale.setScalar(1);
G.mugPop = 0;
G.fill = 0;
updateHUD();

setTimeout(() => {
  loadingEl.classList.add('hide');
  setTimeout(() => loadingEl.remove(), 650);
  if (!seenHelp) setTimeout(openHelp, 420);
}, 400);

for (let i = 0; i < 12; i++){
  setTimeout(() => {
    spawnSparkle(new THREE.Vector3(rand(-0.9, 0.9), rand(0.15, 0.95), rand(-0.4, 0.5)), 0xffc070);
  }, i * 105);
}

/* =========================================================
   LOOP
========================================================= */
let lastTime = performance.now();

function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) lastTime = performance.now();
});
</script>
